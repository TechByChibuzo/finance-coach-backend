name: CI / Deploy to AWS ECS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
  ECR_REPOSITORY: finance-coach-backend
  ECS_CLUSTER: finance-coach-cluster
  ECS_SERVICE: finance-coach-service
  ECS_TASK_FAMILY: finance-coach-backend
  CONTAINER_NAME: finance-coach-backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # contextLoads boots the whole app and needs a real database and secrets,
      # so it is excluded until it runs against Testcontainers
      - name: Run tests
        run: ./mvnw -B test -Dtest='!UserServiceApplicationTests'

  deploy:
    # Only deploy pushes to main, and only if every test passed
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Deploy credentials are secrets of the "production" environment, which only allows
    # the main branch, so workflows on other branches can't read them
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write   # GitHub OIDC: assume an AWS role without long-lived access keys
    env:
      # OIDC role if configured; otherwise the deploy user's access key (accounts that
      # can't create OIDC providers, such as the AWS free plan)
      USE_OIDC: ${{ secrets.AWS_DEPLOY_ROLE_ARN != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure AWS credentials (OIDC role)
        if: env.USE_OIDC == 'true'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials (access key)
        if: env.USE_OIDC != 'true'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Tag with the commit SHA so every deploy is traceable and can be rolled back
      - name: Build and push Docker image
        id: build
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
          docker buildx build \
            --platform linux/amd64 \
            --push \
            -t "$IMAGE" \
            -t "$REGISTRY/$ECR_REPOSITORY:latest" \
            .
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_FAMILY" \
            --query taskDefinition > task-definition.json

      - name: Point task definition at the new image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 # v1.9.1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build.outputs.image }}

      # Registers a new task definition revision and waits for the service to be healthy
      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@ae89e14ac6188020feb2b19228b7149a7bc9cf0b # v2.6.4
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
