name: CI / Deploy to AWS ECS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
  ECR_REPOSITORY: finance-coach-backend
  ECS_CLUSTER: finance-coach-cluster
  ECS_SERVICE: finance-coach-service
  ECS_TASK_FAMILY: finance-coach-backend
  CONTAINER_NAME: finance-coach-backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # contextLoads boots the whole app and needs a real database and secrets,
      # so it is excluded until it runs against Testcontainers.
      # verify also enforces the service-layer coverage gate (JaCoCo, see pom.xml).
      - name: Run tests and check coverage
        run: ./mvnw -B verify -Dtest='!FinanceCoachApplicationTests'

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: target/site/jacoco/
          retention-days: 14

  deploy:
    # Only deploy pushes to main, and only if every test passed
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Deploy credentials are secrets of the "production" environment, which only allows
    # the main branch, so workflows on other branches can't read them
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write   # GitHub OIDC: assume an AWS role without long-lived access keys
    env:
      # OIDC role if configured; otherwise the deploy user's access key (accounts that
      # can't create OIDC providers, such as the AWS free plan)
      USE_OIDC: ${{ secrets.AWS_DEPLOY_ROLE_ARN != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials (OIDC role)
        if: env.USE_OIDC == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials (access key)
        if: env.USE_OIDC != 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Tag with the commit SHA so every deploy is traceable and can be rolled back
      - name: Build and push Docker image
        id: build
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
          docker buildx build \
            --platform linux/amd64 \
            --push \
            -t "$IMAGE" \
            -t "$REGISTRY/$ECR_REPOSITORY:latest" \
            .
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_FAMILY" \
            --query taskDefinition > task-definition.json

      - name: Point task definition at the new image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 # v1.9.1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build.outputs.image }}

      # Registers a new task definition revision and waits for the service to be healthy
      - name: Deploy to ECS
        id: deploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@a00d4d57ac0de1a99b39fe469f3d898d38717c2b # v2.6.4
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      # The stability wait can return as soon as a task is running, before Spring Boot is healthy,
      # and if the new tasks never get healthy the circuit breaker rolls back to the old revision.
      # Wait for the rollout to finish and fail unless the new revision is what's running.
      - name: Verify the new revision is running
        env:
          NEW_TASK_DEFINITION: ${{ steps.deploy.outputs.task-definition-arn }}
        run: |
          for attempt in $(seq 1 60); do
            read -r RUNNING_TD ROLLOUT RUNNING <<< "$(aws ecs describe-services \
              --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
              --query 'services[0].deployments[?status==`PRIMARY`] | [0].[taskDefinition,rolloutState,runningCount]' \
              --output text)"
            echo "Primary deployment: $RUNNING_TD ($ROLLOUT, $RUNNING running)"

            if [ "$RUNNING_TD" != "$NEW_TASK_DEFINITION" ] || [ "$ROLLOUT" = "FAILED" ]; then
              echo "::error::The new version did not become healthy and ECS rolled back. Check the logs: aws logs tail /ecs/finance-coach-backend"
              exit 1
            fi
            if [ "$ROLLOUT" = "COMPLETED" ] && [ "$RUNNING" -ge 1 ]; then
              echo "New version is live."
              exit 0
            fi
            sleep 15
          done
          echo "::error::Rollout still not complete after 15 minutes"
          exit 1
